name: dev-deploy
on:
  push:
    branches:
      - dev
jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: checkout branch.
        uses: actions/checkout@v2
        
      - name: Set up env
        run: echo "VITE_API_BASE_URL=${{ secrets.DEV_API_BASE_URL }}" >> .env

      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: install npm
        run: npm install

      - name: build
        run: npm run build

      - name: show AWS CLI Version
        run: aws --version

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: sync bucket
        run: aws s3 sync ./dist ${{ secrets.DEV_S3_URI }} --region ap-northeast-2 --delete

      - name: invalidation cloudfront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.DEV_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
